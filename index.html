<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ibrahim Awad Almuhaisen | Medical Doctor</title>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --navy-dark: #0a192f;
            --navy-light: #112240;
            --gold: #d4af37;
            --gold-hover: #e5c158;
            --text-light: #e6f1ff;
            --text-muted: #8892b0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--navy-dark);
            color: var(--text-light);
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(circle at top right, var(--navy-light), var(--navy-dark));
        }

        .card-container {
            background-color: var(--navy-light);
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.7);
            border-top: 4px solid var(--gold);
            position: relative;
            overflow: hidden;
        }

        /* Subtle gold glow in background */
        .card-container::before {
            content: '';
            position: absolute;
            top: -50px;
            left: -50px;
            width: 150px;
            height: 150px;
            background: var(--gold);
            filter: blur(100px);
            opacity: 0.15;
            border-radius: 50%;
        }

        .profile-img-container {
            width: 130px;
            height: 130px;
            margin: 0 auto 20px;
            border-radius: 50%;
            padding: 4px;
            border: 2px solid var(--gold);
            background-color: var(--navy-dark);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            object-position: center top;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--gold);
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .title {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 500;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        /* Primary Button (Save Contact) */
        .btn-primary {
            background-color: var(--gold);
            color: var(--navy-dark);
        }

        .btn-primary:hover {
            background-color: var(--gold-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }

        /* Secondary Buttons (Social/Contact) */
        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.03);
            color: var(--text-light);
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .btn-secondary:hover {
            background-color: rgba(212, 175, 55, 0.1);
            border-color: var(--gold);
            color: var(--gold);
            transform: translateY(-2px);
        }

        .btn i {
            font-size: 1.2rem;
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .card-container {
                padding: 30px 20px;
            }
            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="profile-img-container">
            <!-- Make sure your photo is named profile.jpg and is in the same folder -->
            <img src="profile.jpg" alt="Ibrahim Awad Almuhaisen" class="profile-img">
        </div>
        
        <h1>Ibrahim Awad Almuhaisen</h1>
        <div class="title">Medical Doctor</div>

        <div class="links">
            <!-- Save Contact Button -->
            <a href="#" class="btn btn-primary" onclick="downloadVCard()">
                <i class="fas fa-address-card"></i> Save Contact
            </a>

            <!-- Call Button -->
            <a href="tel:+962791309173" class="btn btn-secondary">
                <i class="fas fa-phone-alt"></i> Call Me
            </a>

            <!-- WhatsApp Button -->
            <a href="https://wa.me/962791309173" target="_blank" class="btn btn-secondary">
                <i class="fab fa-whatsapp"></i> WhatsApp
            </a>

            <!-- Email Button -->
            <a href="mailto:ibrahimalmuhaisen.2002@gmail.com" class="btn btn-secondary">
                <i class="fas fa-envelope"></i> Email Me
            </a>

            <!-- LinkedIn Button -->
            <a href="https://www.linkedin.com/in/ibrahim-almuhaisen-298b56390?utm_source=share&utm_campaign=share_via&utm_content=profile&utm_medium=android_app" target="_blank" class="btn btn-secondary">
                <i class="fab fa-linkedin-in"></i> LinkedIn
            </a>
        </div>
    </div>

    <script>
        function downloadVCard() {
            // vCard file content
            var vcard = "BEGIN:VCARD\n" +
                        "VERSION:3.0\n" +
                        "N:Almuhaisen;Ibrahim;Awad;\n" +
                        "FN:Ibrahim Awad Almuhaisen\n" +
                        "TITLE:Medical Doctor\n" +
                        "TEL;TYPE=CELL,VOICE:+962791309173\n" +
                        "EMAIL;TYPE=WORK,INTERNET:ibrahimalmuhaisen.2002@gmail.com\n" +
                        "URL;TYPE=LinkedIn:https://www.linkedin.com/in/ibrahim-almuhaisen-298b56390\n" +
                        "END:VCARD";

            // Create a blob and download link
            var blob = new Blob([vcard], { type: "text/vcard;charset=utf-8;" });
            var url = URL.createObjectURL(blob);
            var link = document.createElement("a");
            
            link.href = url;
            link.download = "Ibrahim_Almuhaisen.vcf";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
